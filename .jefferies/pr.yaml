name: Tube Main PR Pipeline

on:
  pull_request:
    branches:
      - main

nodes:
  - name: Run CI Checks
    image: quay.io/the-conn/jefferies-test
    checkout: true
    steps:
      - rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - rustup component add clippy
      - make ci
